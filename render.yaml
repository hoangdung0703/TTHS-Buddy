# Render Blueprint for the TTHS Buddy backend.
#
# This is optional: you can also create the Web Service by hand in the Render Dashboard
# (native Python runtime, no Docker) using the same Build/Start commands below. Either way,
# Root Directory must stay at the repo root (NOT backend/) because backend/app/core/config.py
# resolves PROJECT_ROOT three levels up from itself and reads ingestion/question_bank.json +
# ingestion/chat_suggestions_seed.json at startup - those only exist alongside backend/, not
# inside it.
#
# Worker count is fixed at 2 (not the usual 2xCPU+1 formula) to fit Render's Free tier
# 512MB RAM ceiling without OOM-killing the service - see requirements.md's capacity audit.
#
# plan: free matches the service that is ACTUALLY deployed (created by hand in the Dashboard,
# Instance Type = Free). This file said `starter` until 2026-10-12, which was never true of the
# running service - and the difference matters: only the Free tier spins down after 15 minutes
# with no requests, so the first request after an idle period pays a cold start. A diagnosis of
# "production chat is slow" that trusted `starter` here would have ruled cold start out
# incorrectly. See DEPLOYMENT.md "Instance Type".
#
# Env vars are declared here with sync: false so Render prompts for real values in the
# Dashboard instead of committing secrets to this file. See DEPLOYMENT.md for the full list
# and where each value comes from.
services:
  - type: web
    # Must match the deployed service, whose host is tths-buddy.onrender.com (see
    # DEPLOYMENT.md "Live URLs") - this said ttths-buddy-backend until 2026-10-12.
    name: tths-buddy
    runtime: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT --chdir backend app.main:app
    healthCheckPath: /api/health
    envVars:
      # NOT what the running service uses: Render's build log of 2026-10-03 shows Python 3.14.3
      # there. The service was created by hand in the Dashboard, so this pin has never actually
      # been applied to it. Kept because it IS the right pin for a Blueprint deploy, and deleting
      # it would hide the discrepancy rather than fix it - see DEPLOYMENT.md "render.yaml is
      # reference material". 3.12.7 has not been verified locally either (the dev machine has
      # 3.14.2 and 3.11.14 only).
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
